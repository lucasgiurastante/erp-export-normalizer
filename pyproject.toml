[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "erp-export-normalizer"
version = "0.3.0"
description = "Schema-driven streaming converter for legacy ERP flat files to JSON/CSV"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lucas Giurastante" }]
keywords = ["erp", "jdedwards", "fixed-width", "etl", "flat-file", "mainframe"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = ["PyYAML>=6.0"]

# The PyPI page is the top of the funnel: someone who arrives via `pip install`
# needs a way to reach the repo, the issue tracker and the changelog. Without
# these, PyPI is a dead end and the visits never become stars or issues.
[project.urls]
Homepage = "https://github.com/lucasgiurastante/erp-export-normalizer"
Repository = "https://github.com/lucasgiurastante/erp-export-normalizer"
Issues = "https://github.com/lucasgiurastante/erp-export-normalizer/issues"
Changelog = "https://github.com/lucasgiurastante/erp-export-normalizer/blob/main/CHANGELOG.md"
"Plugin API (frozen v1)" = "https://github.com/lucasgiurastante/erp-export-normalizer/blob/main/docs/PLUGIN_API_v1.md"
"Copy a flat-file layout" = "https://github.com/lucasgiurastante/erp-export-normalizer/issues/new?title=flat-file+layout%3A&labels=schema+request"
Bugs = "https://github.com/lucasgiurastante/erp-export-normalizer/issues"

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
excel = ["openpyxl>=3.1"]
dataframe = ["pandas>=2", "polars>=1"]
spark = ["pyspark>=4"]
lint = ["ruff>=0.9", "mypy>=1.13"]
postgres = ["psycopg[binary]>=3.2"]
dev = [
    "build>=1.2",
    "hypothesis>=6.100",
    "twine>=5.1",
    "pytest>=8.0",
    "ruff>=0.9",
    "mypy>=1.13",
]
all = [
    "pyarrow>=14",
    "openpyxl>=3.1",
    "pandas>=2",
    "polars>=1",
    "pyspark>=4",
    "psycopg[binary]>=3.2",
    "ruff>=0.9",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true

[project.scripts]
erp-normalize = "cli:main"

[tool.setuptools]
packages = ["core"]
py-modules = ["cli"]

[tool.setuptools.package-data]
core = ["formats/*.yaml", "plugin_examples/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]