format: delimited
version: 1.1.0
description: >-
  SAP FI accounting document header (BKPF) as SAP itself exports it: tab
  delimited, one document per row, optional header. Same rationale as the
  BSEG schema, with the same caveat: the layout depends on the field
  selection, so this is one common selection, not a canonical SAP format.
  Field names and lengths follow the ECC / S/4HANA data dictionary.
codepage: cp1252
delimiter: "\t"
has_header: true
table: bkpf_headers
fields:
  - {name: mandt, type: string}                  # client, 3
  - {name: bukrs, type: string}                  # company code, CHAR 4
  - {name: belnr, type: string}                  # document number, CHAR 10
  - {name: gjahr, type: string}                  # fiscal year, NUMC 4
  - {name: blart, type: string}                  # document type, CHAR 2
  - {name: budat, type: date, format: YYYYMMDD}  # posting date
  - {name: bldat, type: date, format: YYYYMMDD}  # document date
  - {name: monat, type: string}                  # period, NUMC 2
  - {name: usnam, type: string}                  # user, CHAR 12
  - {name: bktxt, type: string}                  # document header text
  - {name: waers, type: string}                  # currency, CHAR 3
