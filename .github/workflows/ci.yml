name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]" pytest
      - name: Test
        run: pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install ruff mypy
      - name: Format check
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Typecheck
        run: mypy cli.py core

  perf:
    # Timing profile. The gate is a relative comparison against the baseline
    # committed in the repo, never an absolute wall-clock limit: GitHub
    # runners are noisy and absolute thresholds produce flaky failures.
    # The determinism check is absolute and always enforced.
    #
    # perf-baseline.json is recorded on a maintainer machine, so its platform
    # does not match the runner. The script detects that and SKIPS the
    # regression verdict rather than failing the build over a hardware
    # difference - timings are still uploaded for review. To gate on the same
    # machine, record the baseline on a runner and pass
    # --require-same-machine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Performance profile
        run: |
          python scripts/perf_profile.py \
            --lines 100000 \
            --tolerance 0.5 \
            --baseline perf-baseline.json \
            --output perf-report.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: perf-report.json
          if-no-files-found: ignore
